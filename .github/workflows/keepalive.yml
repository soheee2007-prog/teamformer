# 생성: 2026-10-29 23:42 KST
# Supabase 무료 프로젝트가 일시정지되지 않도록 매일 DB에 질의한다(3장 "DB 일시정지"의 어려운 해결).
# DATABASE_URL 은 저장소 Settings > Secrets and variables > Actions 에 넣는다. 값은 출력하지 않는다.
name: DB 깨워 두기

on:
  schedule:
    - cron: "0 0 * * *"  # 매일 00:00 UTC = 09:00 KST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "psycopg[binary]"
      - name: DB 질의
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "import os, psycopg; c = psycopg.connect(os.environ['DATABASE_URL']); print('팀 수:', c.execute('select count(*) from tf_teams').fetchone()[0])"
